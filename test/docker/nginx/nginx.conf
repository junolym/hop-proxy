server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static file serving
    location / {
        try_files $uri $uri/ =404;
    }

    # Health check — serve a JSON file
    location /health {
        alias /usr/share/nginx/html/health.json;
        default_type application/json;
    }

    # Header echo — just return simple text
    location /headers {
        default_type application/json;
        return 200 '{"type":"nginx","status":"ok"}';
    }
}
